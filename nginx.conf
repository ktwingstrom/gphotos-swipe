server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 0;

    # Vue Router - SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to Immich, addressed via X-Target-Host (CORS-safe).
    # Client sends VITE_SERVER_URL pointing at this app's origin + /immich-api,
    # plus headers x-api-key and X-Target-Host. We strip /immich-api/ and forward.
    location /immich-api/ {
        rewrite ^/immich-api/(.*) /$1 break;

        resolver 8.8.8.8 1.1.1.1 127.0.0.11 valid=30s ipv6=off;

        set $backend "http://immich-server:2283";
        if ($http_x_target_host) {
            set $backend $http_x_target_host;
        }

        proxy_pass $backend;
        proxy_http_version 1.1;

        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header x-api-key $http_x_api_key;
        proxy_set_header Accept $http_accept;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Range $http_range;
        proxy_pass_request_body on;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'X-Api-Key, X-Target-Host, User-Agent, Content-Type, Authorization, Range, Accept' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range, Accept-Ranges' always;
        if ($request_method = OPTIONS) { return 204; }
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
