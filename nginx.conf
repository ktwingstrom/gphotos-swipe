server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 0;

    # Vue Router - SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin proxy to Immich. The client points VITE_SERVER_URL at this
    # app's own origin and useImmich/SwipeCard call /api/... — we forward to
    # the Immich container by name on the shared docker network. No CORS,
    # no preflights.
    #
    # Default upstream "immich_server" matches the official Immich
    # docker-compose. If your container is named differently, edit this file
    # before building.
    location /api/ {
        proxy_pass http://immich_server:2283/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_request_headers on;
        proxy_pass_request_body on;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
