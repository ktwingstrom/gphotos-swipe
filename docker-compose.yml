services:
  immich-swipe:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build-time .env values are baked into the JS bundle.
        - VITE_SERVER_URL=${VITE_SERVER_URL:-}
        - VITE_USER_1_NAME=${VITE_USER_1_NAME:-}
        - VITE_USER_1_API_KEY=${VITE_USER_1_API_KEY:-}
        - VITE_USER_2_NAME=${VITE_USER_2_NAME:-}
        - VITE_USER_2_API_KEY=${VITE_USER_2_API_KEY:-}
        - VITE_USER_3_NAME=${VITE_USER_3_NAME:-}
        - VITE_USER_3_API_KEY=${VITE_USER_3_API_KEY:-}
        - VITE_USER_4_NAME=${VITE_USER_4_NAME:-}
        - VITE_USER_4_API_KEY=${VITE_USER_4_API_KEY:-}
        - VITE_USER_5_NAME=${VITE_USER_5_NAME:-}
        - VITE_USER_5_API_KEY=${VITE_USER_5_API_KEY:-}
    container_name: immich-swipe
    restart: unless-stopped
    ports:
      - "2293:80"
    networks:
      # Share Immich's network so nginx can resolve `immich_server` by name.
      # Disable this stanza (and the top-level networks block) if you're not
      # co-locating with Immich; in that case set VITE_SERVER_URL directly to
      # the Immich URL and configure CORS on Immich's reverse proxy instead.
      - immich_default

networks:
  immich_default:
    external: true
